[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mhi2-video-finder"
version = "0.4.0"
description = "Search YouTube for music videos, download with yt-dlp, transcode for MMI/MHI2 USB playback"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "typer>=0.12.0",
    "yt-dlp>=2024.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "fastapi>=0.115.0",
]
gui = [
    "PyQt6>=6.6.0",
    "httpx>=0.27.0",
    "websocket-client>=1.8.0",
]
daemon = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
]

[project.scripts]
mhi2-video-finder = "mhi2_video_finder.cli:app"
mhi2-video-finder-ui = "mhi2_video_finder.ui.main:main"
mhi2-video-finder-daemon = "mhi2_video_finder.daemon.main:main"
# Short aliases (same modules as mhi2-*; use after: pip install -e ".[gui]")
video-finder-ui = "mhi2_video_finder.ui.main:main"
video-finder = "mhi2_video_finder.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/applications" = ["mhi2-video-finder.desktop"]

[tool.pytest.ini_options]
testpaths = ["tests"]
