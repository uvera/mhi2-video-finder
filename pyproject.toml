[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mhi2-video-finder"
version = "0.14.2"
description = "Search YouTube for music videos, download with yt-dlp, transcode for MMI/MHI2 USB playback"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "typer>=0.12.0",
    "yt-dlp>=2024.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "fastapi>=0.115.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]
gui = [
    "PyQt6>=6.6.0",
    "httpx>=0.27.0",
    "websocket-client>=1.8.0",
]
daemon = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
]

[project.scripts]
mhi2-video-finder = "mhi2_video_finder.cli:app"
mhi2-video-finder-ui = "mhi2_video_finder.ui.main:main"
mhi2-video-finder-daemon = "mhi2_video_finder.daemon.main:main"
# Short aliases (same modules as mhi2-*; use after: pip install -e ".[gui]")
video-finder-ui = "mhi2_video_finder.ui.main:main"
video-finder = "mhi2_video_finder.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/applications" = ["mhi2-video-finder.desktop"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 110
extend-exclude = ["aur", ".makepkg"]

[tool.ruff.lint]
# Baseline for an until-now unlinted codebase: correctness (F), style (E/W),
# import sorting (I), Python-version modernization (UP), and common-bug
# patterns (B). Stricter rule families (type-annotation coverage, docstrings,
# full pylint, bandit security) are a deliberate follow-up, not part of this
# initial pass, to keep the first green baseline reviewable.
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["mhi2_video_finder"]

[tool.ruff.lint.flake8-bugbear]
# typer.Option()/typer.Argument() as argument defaults is the library's
# documented, required pattern (Typer inspects these objects at import time),
# not the mutable-default-argument bug B008 exists to catch.
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
# The codebase has no prior type-checking history; start advisory (report
# errors where types are already annotated/inferable) rather than requiring
# full annotation coverage everywhere via strict/disallow_untyped_defs.
check_untyped_defs = false
