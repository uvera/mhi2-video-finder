[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "video-finder"
version = "0.1.0"
description = "Search YouTube for music videos, download with yt-dlp, transcode for MMI/MHI2 USB playback"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "typer>=0.12.0",
    "yt-dlp>=2024.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]
gui = [
    "PyQt6>=6.6.0",
]

[project.scripts]
video-finder = "video_finder.cli:app"
video-finder-ui = "video_finder.ui.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/applications" = ["video-finder.desktop"]

[tool.pytest.ini_options]
testpaths = ["tests"]
