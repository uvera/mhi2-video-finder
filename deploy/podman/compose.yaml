# Podman Compose (also works with: docker compose)
# Run from this directory:
#   cp -n config.toml.example config.toml   # edit paths/token as needed
#   cp -n .env.example .env                   # set DAEMON_BEARER_TOKEN here
#
# After git pull, use ./rebuild-daemon.sh so the image actually rebuilds (up --build often skips).
# That script uses: sudo podman-compose (set USE_SUDO=0 for rootless).
# Quick start without script: sudo podman-compose build --no-cache && sudo podman-compose up -d
#
#   podman compose up -d --build              # or: podman-compose up -d --build (older Podman)
#
# .env is passed directly to the container via env_file.
# This avoids Podman Compose interpolation quirks with token values.
#
# Logs: podman logs -f mhi2-vf   (reliable; includes stderr / NDJSON banner)
#       or podman-compose logs -f mhi2-vf
# Stop: podman compose down  /  podman-compose down

services:
  mhi2-vf:
    build:
      # Repo root. podman-compose 1.0.x only looks for a file named "Dockerfile" in the
      # context dir (ignores dockerfile:); repo root has Dockerfile -> Containerfile symlink.
      context: ../..
      # Honored by docker compose / podman compose; ignored by podman-compose 1.0.x (use rebuild-daemon.sh).
      network: host
    image: mhi2-video-finder-daemon
    container_name: mhi2-vf
    ports:
      - "${MHI2_VF_PORT:-8765}:8765"
    env_file:
      - .env
    environment:
      DAEMON_HOST: "0.0.0.0"
      DAEMON_PORT: "8765"
      PYTHONUNBUFFERED: "1"
      DAEMON_STATE_DIR: /var/lib/mhi2-video-finder/state
      MHI2_VIDEO_FINDER_CONFIG: /config/config.toml
      # NDJSON runtime diagnostics (emit_debug_log); host path: ./debug/debug-runtime.log
      MHI2_VF_DEBUG_LOG_PATH: /var/lib/mhi2-video-finder/debug/debug-runtime.log
    volumes:
      - ./config.toml:/config/config.toml:ro,Z
      - mhi2-vf-state:/var/lib/mhi2-video-finder/state:Z
      - ./debug:/var/lib/mhi2-video-finder/debug:Z
      - mhi2-vf-raw:/root/.cache/mhi2-video-finder/raw:Z
      - mhi2-vf-output:/root/Videos/mhi2-video-finder:Z
    restart: unless-stopped

volumes:
  mhi2-vf-state:
  mhi2-vf-raw:
  mhi2-vf-output:
